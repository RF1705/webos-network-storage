name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional release version, for example v0.1.0"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Run helper tests
        run: tests/run.sh

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install webOS packaging tools
        run: npm ci

      - name: Run service tests
        run: node tests/profile-store.test.js

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false

      - name: Download dependencies
        working-directory: tools/rclone-smb
        run: go mod tidy

      - name: Build ARMv7 helper
        working-directory: tools/rclone-smb
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm
          GOARM: "7"
        run: >-
          go build -trimpath
          -ldflags="-s -w"
          -o ../../dist/rclone-smb
          .

      - name: Resolve package version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -eu

          release_version=
          if [ -n "$REQUESTED_VERSION" ]; then
            release_version=$REQUESTED_VERSION
          elif printf '%s\n' "$COMMIT_MESSAGE" |
            grep -Eq '^Release v?[0-9]+\.[0-9]+\.[0-9]+$'; then
            release_version=${COMMIT_MESSAGE#Release }
          fi

          if [ -n "$release_version" ]; then
            if ! printf '%s\n' "$release_version" |
              grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "Invalid version: $release_version" >&2
              exit 1
            fi
            package_version=${release_version#v}
            release_version=v$package_version
            ipk_version=$package_version
          else
            package_version=$(git rev-parse --short HEAD)
            ipk_version="0.0.${GITHUB_RUN_NUMBER}"
          fi

          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"
          echo "ipk_version=$ipk_version" >> "$GITHUB_OUTPUT"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"

      - name: Prepare IPK and distribution archive
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
          IPK_VERSION: ${{ steps.version.outputs.ipk_version }}
        run: |
          set -eu

          node -e '
            const fs = require("fs");
            const file = "app/appinfo.json";
            const app = JSON.parse(fs.readFileSync(file, "utf8"));
            app.version = process.argv[1];
            fs.writeFileSync(file, JSON.stringify(app, null, 2) + "\n");
          ' "$IPK_VERSION"
          node tools/make-icons.js
          mkdir -p service/bin dist
          install -m 0755 bin/webos-network-storage service/bin/
          install -m 0755 dist/rclone-smb service/bin/
          node tools/package-ipk.js app service dist

          ipk="dist/com.rf1705.networkstorage_${IPK_VERSION}_arm.ipk"
          test -f "$ipk"
          verify_dir=$(mktemp -d)
          (
            cd "$verify_dir"
            ar x "$GITHUB_WORKSPACE/$ipk"
            tar --no-same-owner -xzf control.tar.gz control
            grep -qx 'Architecture: arm' control
            tar -tzf data.tar.gz |
              grep -qx 'usr/palm/services/com.rf1705.networkstorage.service/bin/rclone-smb'
          )
          rm -rf "$verify_dir"

          package_dir=build/webos-network-storage
          mkdir -p "$package_dir/bin" dist
          install -m 0755 bin/webos-network-storage "$package_dir/bin/"
          install -m 0755 dist/rclone-smb "$package_dir/bin/"
          cp -R config docs LICENSE README.md "$package_dir/"

          archive="dist/webos-network-storage-${PACKAGE_VERSION}-armv7.tar.gz"
          tar -czf "$archive" -C build webos-network-storage

          node tools/create-manifest.js \
            app/appinfo.json \
            "$ipk" \
            dist/com.rf1705.networkstorage.manifest.json

          (
            cd dist
            sha256sum webos-network-storage-*.tar.gz *.ipk \
              > "webos-network-storage-${PACKAGE_VERSION}.sha256"
          )

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: webos-network-storage
          path: |
            dist/*.ipk
            dist/*.manifest.json
            dist/webos-network-storage-*.tar.gz
            dist/webos-network-storage-*.sha256
          if-no-files-found: error

  release:
    if: ${{ needs.build.outputs.release_version != '' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: webos-network-storage
          path: release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.release_version }}
        run: >-
          gh release create "$VERSION"
          release/*
          --repo "$GITHUB_REPOSITORY"
          --title "$VERSION"
          --generate-notes
