name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run helper tests
        run: tests/run.sh

  rclone-smb:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/rclone-smb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false
      - name: Download dependencies
        run: go mod download
      - name: Build ARMv7 helper
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm
          GOARM: "7"
        run: >-
          go build -trimpath
          -ldflags="-s -w"
          -o ../../dist/rclone-smb
          .
      - uses: actions/upload-artifact@v4
        with:
          name: webos-network-storage-armv7
          path: |
            bin/webos-network-storage
            dist/rclone-smb
